<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Желдету жүйесі бойынша квиз</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        /* Базовые стили */
        :root {
            --bg-gradient: linear-gradient(135deg, #eef2f6 0%, #e0e7ff 100%);
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --primary-blue: #4f46e5;
            --border-color: #e5e7eb;
            --progress-gradient: linear-gradient(90deg, #f97316, #ec4899);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', 'Inter Tight', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px; /* Уменьшен общий отступ для лучшего центрирования */
        }

        /* Контейнер квиза и эффект стопки карточек */
        .quiz-container {
            position: relative;
            width: 100%;
            max-width: 540px;
            margin: 0 auto;
        }

        .card-layer {
            position: absolute;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            height: 100%;
            transition: all 0.3s ease;
        }

        .card-layer-3 {
            transform: translateY(24px) scale(0.92);
            opacity: 0.4;
            z-index: 1;
        }

        .card-layer-2 {
            transform: translateY(12px) scale(0.96);
            opacity: 0.7;
            z-index: 2;
        }

        /* Основная карточка */
        .card-main {
            position: relative;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            z-index: 3;
            padding: 40px;
            min-height: 580px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Анимация смены контента */
        .fade-content {
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Прогресс бар */
        .progress-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .progress-segment {
            height: 6px;
            flex: 1;
            background: #f3f4f6;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .progress-segment.active {
            background: var(--progress-gradient);
        }

        /* Заголовки */
        .q-number {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .q-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
            margin-bottom: 24px;
        }

        .q-subtitle {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        /* Варианты ответов */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            margin-bottom: 10px;
        }

        /* Сетка для вариантов с картинками и текстовых квадратов */
        .options-list.with-images,
        .options-list.text-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--card-bg);
        }

        /* Стили карточки с фото */
        .option-item.has-image {
            padding: 12px;
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
            border: 2px solid var(--border-color);
        }

        /* Стили карточки (текстовые квадраты) */
        .option-item.text-square {
            padding: 24px 16px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 16px;
            border: 2px solid var(--border-color);
            min-height: 140px;
        }

        .option-item:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .option-item.selected {
            background: transparent;
            border-color: transparent;
        }

        .option-item.has-image.selected,
        .option-item.text-square.selected {
            border-color: var(--primary-blue);
            background: #f4f7ff; /* легкий синий фон для выбранной карточки */
        }

        .option-item.text-square .option-text {
            font-weight: 600;
            font-size: 20px; /* Увеличили размер текста для 4 вопроса */
        }

        .option-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #f3f4f6; /* цвет загрузки */
        }

        .option-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .radio-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            background: white;
        }

        /* Квадратный чекбокс для множественного выбора */
        .checkbox-btn {
            border-radius: 6px !important;
        }

        .option-item.selected .radio-btn {
            background: var(--primary-blue);
            border-color: var(--primary-blue);
        }

        .radio-btn svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: white;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
        }

        .option-item.selected .radio-btn svg {
            opacity: 1;
            transform: scale(1);
        }

        .option-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-main);
            line-height: 1.4;
        }

        /* Форма контактов (Последний шаг) */
        .lead-form-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-grow: 1;
        }
        
        .lead-text {
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .lead-magnet {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #166534;
            margin-bottom: 10px;
        }

        .input-field {
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            font-size: 16px;
            font-family: 'Google Sans', 'Inter Tight', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary-blue);
        }

        /* Ошибки валидации */
        .input-field.error {
            border-color: #ef4444; /* Красный цвет для ошибки */
        }

        .error-message {
            color: #ef4444;
            font-size: 13px;
            font-weight: 500;
            margin-top: -10px;
            margin-bottom: 4px;
            display: none; /* Скрыто по умолчанию */
        }

        /* Кнопка отправки формы / перехода */
        .btn-submit {
            background: #18181b;
            color: #ffffff;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 2px #18181b;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800; /* Сделали текст жирнее */
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 10px;
            width: 100%;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Экран успешной отправки и 2D галочка */
        .success-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
            flex-grow: 1;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: #22c55e; /* Обычный 2D зеленый цвет */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            transform: scale(0);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .success-icon svg {
            width: 40px;
            height: 40px;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawCheck 0.4s 0.3s ease forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            body {
                padding: 12px; /* Ровные и небольшие отступы по краям экрана */
            }
            .card-main {
                padding: 24px 16px; /* Уменьшаем внутренний padding для центрирования на смартфонах */
                min-height: 480px;
            }
            .options-list.with-images,
            .options-list.text-grid {
                gap: 10px;
            }
            .option-item.has-image {
                padding: 8px;
                gap: 8px;
            }
            .option-image {
                height: 90px; /* Картинка меньше на мобильном */
            }
            .option-text {
                font-size: 13px; /* Текст чуть меньше в карточках */
            }
            .option-item.text-square {
                padding: 16px 12px;
                min-height: 110px;
                gap: 12px;
            }
            .option-item.text-square .option-text {
                font-size: 16px; /* Увеличили размер текста на смартфонах */
            }
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- Декоративные карточки на фоне -->
        <div class="card-layer card-layer-3"></div>
        <div class="card-layer card-layer-2"></div>
        
        <!-- Основная карточка с контентом -->
        <div class="card-main">
            <!-- Прогресс бар -->
            <div class="progress-bar" id="progressBar">
                <div class="progress-segment"></div>
                <div class="progress-segment"></div>
                <div class="progress-segment"></div>
                <div class="progress-segment"></div>
                <div class="progress-segment"></div>
            </div>

            <!-- Динамичный контент квиза -->
            <div id="quizContent" class="fade-content" style="display: flex; flex-direction: column; flex-grow: 1;">
                <!-- Сюда подгружается контент через JS -->
            </div>
        </div>
    </div>

    <script>
        // Данные квиза
        const quizData = [
            {
                qNumber: "Сұрақ - 1",
                title: "Желдету жүйесін қай жерге орнату қажет?",
                subtitle: "БІР НҰСҚАНЫ ТАҢДАҢЫЗ",
                options: [
                    "Алматы қаласы",
                    "Қаскелең",
                    "Талғар",
                    "Алматы облысы (басқа елді мекен)"
                ]
            },
            {
                qNumber: "Сұрақ - 2",
                title: "Нысанның түрін таңдаңыз:",
                subtitle: "БІР НҰСҚАНЫ ТАҢДАҢЫЗ",
                options: [
                    "Жеке үй / Коттедж",
                    "Пәтер (Тұрғын үй кешені)",
                    "Бизнес нысаны (Офис, Отель, Мейрамхана)",
                    "Құрылысы жүріп жатқан нысан (Черновой)"
                ],
                // Добавлены картинки к вариантам ответа
                images: [
                    "images/1.jpg",
                    "images/2.jpg",
                    "images/3.jpg",
                    "images/4.webp"
                ]
            },
            {
                qNumber: "Сұрақ - 3",
                title: "Сізді қандай мәселе мазалайды?",
                subtitle: "БІРНЕШЕ НҰСҚАНЫ ТАҢДАУҒА БОЛАДЫ", // Изменен подзаголовок
                options: [
                    "Терезелер терлейді және ылғалдылық жоғары",
                    "Қабырғаларда зең (плесень) пайда болды",
                    "Үй іші өте тымырсық (духота), ауа жетпейді",
                    "Алматының смогы мен шаңынан қорғану қажет",
                    "Жаңа үй салып жатырмын, алдын алғым келеді"
                ],
                isMultichoice: true // Флаг множественного выбора
            },
            {
                qNumber: "Сұрақ - 4",
                title: "Нысанның жалпы шаршы метрі (м²) қандай?",
                subtitle: "БІР НҰСҚАНЫ ТАҢДАҢЫЗ",
                options: [
                    "100 м²-ге дейін",
                    "100 — 200 м²",
                    "200 — 400 м²",
                    "400 м²-ден астам"
                ],
                isTextGrid: true // Флаг для отображения в виде текстовых квадратов
            },
            {
                // Шаг 5: Lead Form
                title: "Рахмет! Жауаптарыңыз қабылданды.",
                isForm: true
            }
        ];

        // Состояние квиза
        let currentStep = 0;
        let answers = {}; // Хранение ответов пользователя
        let isTransitioning = false; // Блокировка двойного клика

        // Элементы DOM
        const contentDiv = document.getElementById('quizContent');
        const segments = document.querySelectorAll('.progress-segment');

        // Иконка галочки для радио-кнопки
        const checkIcon = `<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>`;

        // Функция рендера текущего шага
        function renderStep() {
            // Перезапуск анимации
            contentDiv.classList.remove('fade-content');
            void contentDiv.offsetWidth; // trigger reflow
            contentDiv.classList.add('fade-content');

            const stepData = quizData[currentStep];

            // Обновление прогресс бара
            segments.forEach((seg, index) => {
                if (index <= currentStep) {
                    seg.classList.add('active');
                } else {
                    seg.classList.remove('active');
                }
            });

            // Рендер Формы (Последний шаг)
            if (stepData.isForm) {
                contentDiv.innerHTML = `
                    <div class="q-title">${stepData.title}</div>
                    <div class="lead-form-container">
                        <p class="lead-text">Біздің инженер сіздің нысаныңыз бойынша есептеулер жүргізу үшін 10 минут ішінде хабарласады.</p>
                        <div class="lead-magnet">
                            🎁 Байланыс нөміріңізді қалдырып, инженердің тегін келуі мен нысанды тексеруін брондаңыз!
                        </div>
                        <input type="text" id="userName" class="input-field" placeholder="Атыңыз" required>
                        <div class="error-message" id="nameError">Атыңызды жазыңыз</div>
                        
                        <input type="tel" id="userPhone" class="input-field" placeholder="+7 (---) --- -- --" value="+7 " required>
                        <div class="error-message" id="phoneError">Толық нөмірді енгізіңіз</div>
                        
                        <button class="btn-submit" id="btnSubmit" onclick="submitQuiz()">НӘТИЖЕНІ АЛУ ЖӘНЕ ЖАЗЫЛУ</button>
                    </div>
                `;
                
                // Слушатели для очистки ошибок при вводе текста
                const nameInput = document.getElementById('userName');
                nameInput.addEventListener('input', function() {
                    this.classList.remove('error');
                    document.getElementById('nameError').style.display = 'none';
                });

                const phoneInput = document.getElementById('userPhone');
                phoneInput.addEventListener('input', function(e) {
                    this.classList.remove('error');
                    document.getElementById('phoneError').style.display = 'none';
                    onPhoneInput(e);
                });
                phoneInput.addEventListener('keydown', onPhoneKeyDown);
                return;
            }

            // Рендер обычного вопроса (С картинками, текстовая сетка или обычный список)
            let optionsHtml = stepData.options.map((opt, index) => {
                // Проверяем, выбран ли пункт (разная логика для мультивыбора и обычного)
                const isSelected = stepData.isMultichoice ? 
                    (answers[currentStep] && answers[currentStep].includes(opt)) : 
                    (answers[currentStep] === opt);
                    
                // Проверяем, есть ли картинка для этого пункта
                const imgSrc = stepData.images ? stepData.images[index] : null;
                
                // Для мультивыбора делаем иконку квадратной
                const btnClass = stepData.isMultichoice ? 'radio-btn checkbox-btn' : 'radio-btn';

                if (imgSrc) {
                    // Вариант С картинкой (карточка)
                    return `
                        <div class="option-item has-image ${isSelected ? 'selected' : ''}" onclick="selectOption('${opt}')">
                            <img src="${imgSrc}" class="option-image" alt="Нысан">
                            <div class="option-content">
                                <div class="${btnClass}">${checkIcon}</div>
                                <div class="option-text">${opt}</div>
                            </div>
                        </div>
                    `;
                } else if (stepData.isTextGrid) {
                    // Вариант ТЕКСТОВАЯ СЕТКА (Квадраты с текстом)
                    return `
                        <div class="option-item text-square ${isSelected ? 'selected' : ''}" onclick="selectOption('${opt}')">
                            <div class="option-text">${opt}</div>
                            <div class="${btnClass}">${checkIcon}</div>
                        </div>
                    `;
                } else {
                    // Обычный вариант БЕЗ картинки (список)
                    return `
                        <div class="option-item ${isSelected ? 'selected' : ''}" onclick="selectOption('${opt}')">
                            <div class="${btnClass}">${checkIcon}</div>
                            <div class="option-text">${opt}</div>
                        </div>
                    `;
                }
            }).join('');

            // Применяем класс сетки, если это изображения или текстовая плитка
            let listClass = 'options-list';
            if (stepData.images) listClass += ' with-images';
            if (stepData.isTextGrid) listClass += ' text-grid';

            // Если вопрос с множественным выбором, добавляем кнопку "Далее"
            let nextBtnHtml = '';
            if (stepData.isMultichoice) {
                const hasSelection = answers[currentStep] && answers[currentStep].length > 0;
                nextBtnHtml = `
                    <div style="margin-top: 10px;">
                        <button class="btn-submit" onclick="nextStep()" ${!hasSelection ? 'disabled' : ''}>КЕЛЕСІ СҰРАҚ</button>
                    </div>
                `;
            }

            contentDiv.innerHTML = `
                <div class="q-number">${stepData.qNumber}</div>
                <div class="q-title">${stepData.title}</div>
                <div class="q-subtitle">${stepData.subtitle}</div>
                <div class="${listClass}">
                    ${optionsHtml}
                </div>
                ${nextBtnHtml}
            `;
        }

        // Функция выбора ответа с моментальным переходом
        function selectOption(optionText) {
            const stepData = quizData[currentStep];

            if (stepData.isMultichoice) {
                // Логика множественного выбора
                if (!answers[currentStep]) answers[currentStep] = []; // Инициализируем массив
                
                const idx = answers[currentStep].indexOf(optionText);
                if (idx > -1) {
                    answers[currentStep].splice(idx, 1); // Убираем, если уже выбран
                } else {
                    answers[currentStep].push(optionText); // Добавляем, если не выбран
                }
                
                renderStep(); // Перерисовываем карточку (обновляются чекбоксы и кнопка "Далее")
            } else {
                // Логика одиночного выбора (моментальный переход без задержки)
                answers[currentStep] = optionText;
                nextStep(); 
            }
        }

        // Маска для казахстанского номера телефона
        function onPhoneInput(e) {
            let input = e.target;
            let numbers = input.value.replace(/\D/g, ''); // Оставляем только цифры
            
            if (!numbers) {
                input.value = '';
                return;
            }

            // Автоматическая корректировка префикса
            if (numbers[0] === '8') {
                numbers = '7' + numbers.slice(1);
            }
            if (numbers[0] !== '7') {
                numbers = '7' + numbers;
            }

            // Формируем строку +7 (XXX) XXX XX XX
            let formatted = '+7 ';
            if (numbers.length > 1) {
                formatted += '(' + numbers.substring(1, 4);
            }
            if (numbers.length >= 5) {
                formatted += ') ' + numbers.substring(4, 7);
            }
            if (numbers.length >= 8) {
                formatted += ' ' + numbers.substring(7, 9);
            }
            if (numbers.length >= 10) {
                formatted += ' ' + numbers.substring(9, 11);
            }

            input.value = formatted;
        }

        // Обработка удаления (Backspace)
        function onPhoneKeyDown(e) {
            if (e.keyCode === 8 && e.target.value.replace(/\D/g, '').length <= 1) {
                e.target.value = ''; // Полностью очищаем поле, если удаляем последнюю цифру
            }
        }

        // Логика перехода вперед
        function nextStep() {
            if (currentStep < quizData.length - 1) {
                currentStep++;
                renderStep();
            }
        }

        // Отправка формы
        function submitQuiz() {
            const nameInput = document.getElementById('userName');
            const phoneInput = document.getElementById('userPhone');
            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();
            const btnSubmit = document.getElementById('btnSubmit');
            
            let isValid = true;

            // Валидация имени
            if (name.length < 2) {
                nameInput.classList.add('error');
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            }

            // Валидация телефона (должно быть 18 символов: +7 (XXX) XXX XX XX)
            if (phone.length !== 18) {
                phoneInput.classList.add('error');
                document.getElementById('phoneError').style.display = 'block';
                isValid = false;
            }

            // Прерываем отправку, если есть ошибки
            if (!isValid) return;

            // Блокируем кнопку, чтобы не нажали дважды, и меняем текст
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Жіберілуде...";
            
            // Формируем текст из ответов квиза
            let answersText = "Жауаптар:\n";
            for (let key in answers) {
                // Если ответ - это массив (как в вопросе 3), объединяем через запятую
                let answerVal = Array.isArray(answers[key]) ? answers[key].join(', ') : answers[key];
                answersText += `${quizData[key].title} - ${answerVal}\n`;
            }

            const payload = {
                name: name,
                phone: phone,
                answers: answersText
            };

            // Отправляем данные на ваш серверный скрипт Vercel (полный URL)
            fetch('https://project-ekokl.vercel.app/api/amo', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                // Показываем экран успеха
                contentDiv.classList.remove('fade-content');
                void contentDiv.offsetWidth;
                contentDiv.classList.add('fade-content');
                
                contentDiv.innerHTML = `
                    <div class="success-screen">
                        <div class="success-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                        </div>
                        <div class="q-title">Өтінім қабылданды!</div>
                        <p class="lead-text" style="margin-top: 10px;">Қызығушылық танытқаныңызға рахмет. Жақын арада инженер сізбен хабарласады.</p>
                        <p class="lead-text" style="margin-top: 15px; font-weight: 600; color: #16a34a; font-size: 14px;">Қазір сіз WhatsApp-қа өтесіз...</p>
                    </div>
                `;

                // Автоматическая переадресация в WhatsApp через 2.5 секунды
                setTimeout(() => {
                    window.location.href = "https://wa.me/77076141819?text=%D0%A1%D3%99%D0%BB%D0%B5%D0%BC%D0%B5%D1%82%D1%81%D1%96%D0%B7%20%D0%B1%D0%B5%2C%20%D1%82%D0%B5%D0%B3%D1%96%D0%BD%20%D0%B7%D0%B0%D0%BC%D0%B5%D1%80%20%D0%B6%D3%99%D0%BD%D0%B5%20%D0%BA%D0%BE%D0%BD%D1%81%D1%83%D0%BB%D1%8C%D1%82%D0%B0%D1%86%D0%B8%D1%8F%20%D0%B0%D0%BB%D0%B0%D0%B9%D1%8B%D0%BD%20%D0%B4%D0%B5%D0%BF%20%D0%B5%D0%B4%D1%96%D0%BC";
                }, 2500);
            })
            .catch(error => {
                console.error("Қате шықты:", error);
                btnSubmit.disabled = false;
                btnSubmit.innerText = "НӘТИЖЕНІ АЛУ ЖӘНЕ ЖАЗЫЛУ";
                alert("Ошибка отправки. Проверьте подключение к интернету.");
            });
        }

        // Инициализация при загрузке
        renderStep();
    </script>
</body>
